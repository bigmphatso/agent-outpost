[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outpost-agent"
version = "0.1.0"
description = "OUTPOST endpoint monitoring and management agent."
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.3"
]

[project.optional-dependencies]
build = [
  "pyinstaller==6.20.0"
]

[project.scripts]
outpost-agent = "outpost_agent.main:main"
outpost-agent-install = "outpost_agent.installer:main"

[tool.setuptools.packages.find]
include = ["outpost_agent*"]
