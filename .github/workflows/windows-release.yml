name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows executables
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build agent executables
        run: |
          python -m PyInstaller --clean --onefile --console --icon assets/Outpost-logo.ico --name outpost-agent outpost_agent/main.py
          python -m PyInstaller --clean --onefile --console --icon assets/Outpost-logo.ico --name outpost-agent-install outpost_agent/installer.py

      - name: Create installer package
        shell: pwsh
        run: |
          $packageDir = "outpost-agent-installer-windows-x64"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Copy-Item dist\outpost-agent.exe $packageDir\
          Copy-Item dist\outpost-agent-install.exe $packageDir\
          Copy-Item scripts\install-agent-package.ps1 $packageDir\
          Copy-Item scripts\uninstall-outpost-agent.ps1 $packageDir\
          Copy-Item installer-package\README.md $packageDir\README.md

          $manifest = [ordered]@{
            product = "OUTPOST Agent"
            package = "outpost-agent-installer-windows-x64"
            version = "${{ github.ref_name }}"
            commit = "${{ github.sha }}"
            backend_default = "https://outpost-listener.vercel.app"
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            files = @(
              "outpost-agent.exe",
              "outpost-agent-install.exe",
              "install-agent-package.ps1",
              "uninstall-outpost-agent.ps1",
              "README.md"
            )
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path "$packageDir\release-manifest.json" -Encoding ascii

          Get-FileHash dist\outpost-agent.exe, dist\outpost-agent-install.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii

          Get-FileHash "$packageDir\outpost-agent.exe", "$packageDir\outpost-agent-install.exe", "$packageDir\install-agent-package.ps1", "$packageDir\uninstall-outpost-agent.ps1", "$packageDir\README.md", "$packageDir\release-manifest.json" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Path "$packageDir\SHA256SUMS.txt" -Encoding ascii

          Compress-Archive `
            -Path dist\outpost-agent.exe, dist\outpost-agent-install.exe, dist\SHA256SUMS.txt `
            -DestinationPath outpost-agent-windows-x64.zip `
            -Force

          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath outpost-agent-installer-windows-x64.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: outpost-agent-windows-x64
          path: |
            dist/outpost-agent.exe
            dist/outpost-agent-install.exe
            dist/SHA256SUMS.txt
            outpost-agent-windows-x64.zip
            outpost-agent-installer-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/outpost-agent.exe
            dist/outpost-agent-install.exe
            dist/SHA256SUMS.txt
            outpost-agent-windows-x64.zip
            outpost-agent-installer-windows-x64.zip
